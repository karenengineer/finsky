<header class="header">
  <div class="container nav">
    <a class="logo" routerLink="/" (click)="menuOpen.set(false)">
      <span class="logo-mark">Ф</span>
      <span>{{ 'common.brand' | translate }}<small>{{ 'common.tagline' | translate }}</small></span>
    </a>
    <nav [class.open]="menuOpen()">
      <a routerLink="/about" routerLinkActive="active" (click)="menuOpen.set(false)">{{ 'common.nav.about' | translate }}</a>
      <a routerLink="/services" routerLinkActive="active" (click)="menuOpen.set(false)">{{ 'common.nav.services' | translate }}</a>
      <a routerLink="/contacts" routerLinkActive="active" (click)="menuOpen.set(false)">{{ 'common.nav.contacts' | translate }}</a>
      <app-language-switcher class="mobile-language" />
      <a class="mobile-cta" routerLink="/contacts" (click)="menuOpen.set(false)">{{ 'common.nav.getConsultation' | translate }}</a>
    </nav>
    <app-language-switcher class="desktop-language" />
    <a class="header-cta" routerLink="/contacts">{{ 'common.nav.consult' | translate }} <span class="arrow">→</span></a>
    <button class="menu" [attr.aria-label]="'common.a11y.openMenu' | translate" (click)="menuOpen.set(!menuOpen())">
      <span></span><span></span>
    </button>
  </div>
</header>
