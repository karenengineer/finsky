@if (config(); as section) {
  @if (section.isVisible && content(); as text) {
    <section
      class="team-section"
      [style.background-image]="'url(' + section.backgroundImageUrl + ')'"
      [style.--team-overlay]="section.overlayOpacity"
    >
      <div class="team-overlay"></div>
      <div class="container team-inner">
        <div class="team-copy">
          <div class="team-label"><span></span>{{ text.label }}</div>
          <h2>{{ text.title }}</h2>
          <p>{{ text.description }}</p>
          <a class="team-cta" [routerLink]="section.ctaLink">
            {{ text.ctaText }} <span>→</span>
          </a>
        </div>
        <div class="trust-points" aria-hidden="true">
          <span>01</span><span>02</span><span>03</span>
        </div>
      </div>
    </section>
  }
}
