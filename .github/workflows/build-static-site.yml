name: Build static site

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/finsky-rebrand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate localized content
        run: npm run test:content

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build production site
        run: npm run build

      - name: Create shared-hosting archive
        working-directory: dist/finsky/browser
        run: zip -qr ../finsky-shared-hosting.zip .

      - name: Upload deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: finsky-shared-hosting
          path: dist/finsky/finsky-shared-hosting.zip
          if-no-files-found: error
